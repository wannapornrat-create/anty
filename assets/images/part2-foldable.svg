<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="foldScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="hingeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="foldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgFoldGrad)" />

  <!-- Grid Pattern -->
  <g opacity="0.07" stroke="#a855f7" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" /><line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" /><line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" /><line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="270" cy="240" r="160" fill="#a855f7" opacity="0.15" filter="url(#foldGlow)" />
  <circle cx="560" cy="240" r="140" fill="#06b6d4" opacity="0.1" filter="url(#foldGlow)" />

  <!-- Folding Phone Graphic (Galaxy Z Fold) -->
  <g transform="translate(90, 70)">
    <!-- Left Wing / Screen Half -->
    <path d="M 50 40 L 170 30 L 170 350 L 50 340 Z" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <path d="M 55 45 L 165 36 L 165 344 L 55 335 Z" fill="url(#foldScreenGrad)" opacity="0.85" />
    <path d="M 60 50 L 110 46 L 90 330 L 60 330 Z" fill="#ffffff" opacity="0.08" />

    <!-- Center Hinge Mechanism (Flex Hinge) -->
    <rect x="170" y="25" width="24" height="330" rx="4" fill="url(#hingeGrad)" stroke="#475569" stroke-width="1.5" />
    <line x1="182" y1="25" x2="182" y2="355" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,4" />
    <circle cx="182" cy="70" r="4" fill="#64748b" />
    <circle cx="182" cy="190" r="4" fill="#64748b" />
    <circle cx="182" cy="310" r="4" fill="#64748b" />

    <!-- Right Wing / Screen Half (Angled Open Perspective) -->
    <path d="M 194 30 L 314 40 L 314 340 L 194 350 Z" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <path d="M 199 36 L 309 45 L 309 335 L 199 344 Z" fill="url(#foldScreenGrad)" opacity="0.95" />
    <path d="M 210 40 L 260 45 L 290 330 L 220 340 Z" fill="#ffffff" opacity="0.06" />

    <!-- Punch Hole Camera on Right Wing -->
    <circle cx="254" cy="55" r="4.5" fill="#000000" stroke="#334155" />
    <circle cx="254" cy="55" r="2" fill="#1e293b" />

    <!-- Technical Badge overlay -->
    <rect x="70" y="160" width="224" height="75" rx="10" fill="rgba(15, 23, 42, 0.88)" stroke="#a855f7" stroke-width="1" />
    <text x="182" y="185" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" text-anchor="middle">UTG (ULTRA THIN GLASS)</text>
    <text x="182" y="204" fill="#ffffff" font-family="'Prompt', sans-serif" font-weight="600" font-size="12" text-anchor="middle">DYNAMIC AMOLED 2X 120Hz</text>
    <text x="182" y="222" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" text-anchor="middle">ZERO-GAP DUAL-RAIL HINGE</text>
  </g>

  <!-- Product Details Right Panel -->
  <g transform="translate(450, 85)">
    <rect x="0" y="0" width="190" height="30" rx="15" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1.5" />
    <text x="95" y="20" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle">FOLDABLE SPECIALIST</text>

    <text x="0" y="68" fill="#ffffff" font-family="'Prompt', sans-serif" font-weight="800" font-size="22">ชุดจอใน & บานพับ Z Fold 5</text>
    <text x="0" y="94" fill="#94a3b8" font-family="'Prompt', sans-serif" font-size="14">Original Service Pack จอในแท้พร้อมแกนพับ</text>

    <!-- Specs card -->
    <rect x="0" y="115" width="320" height="145" rx="14" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(148, 163, 184, 0.2)" />
    <text x="18" y="145" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">PART NUMBER</text>
    <text x="18" y="165" fill="#c084fc" font-family="'Plus Jakarta Sans', monospace" font-weight="700" font-size="14">GH82-31644A / GH82-31645B</text>

    <line x1="18" y1="180" x2="302" y2="180" stroke="rgba(148, 163, 184, 0.15)" />

    <text x="18" y="200" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">SERIES SUPPORT</text>
    <text x="18" y="220" fill="#f1f5f9" font-family="'Prompt', sans-serif" font-weight="600" font-size="12">Galaxy Z Fold 5 / Z Fold 4 / Z Flip 5 / 4</text>
    <text x="18" y="242" fill="#10b981" font-family="'Prompt', sans-serif" font-weight="600" font-size="12">● ทดสอบการพับ 200,000 ครั้งตามมาตรฐาน</text>

    <!-- Feature tags -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="100" height="28" rx="6" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1" />
      <text x="50" y="18" fill="#c084fc" font-family="'Prompt', sans-serif" font-weight="600" font-size="10" text-anchor="middle">จอแท้ไร้รอยย่น</text>

      <rect x="110" y="0" width="105" height="28" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1" />
      <text x="162" y="18" fill="#06b6d4" font-family="'Prompt', sans-serif" font-weight="600" font-size="10" text-anchor="middle">พร้อมบานพับแท้</text>

      <rect x="225" y="0" width="95" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
      <text x="272" y="18" fill="#10b981" font-family="'Prompt', sans-serif" font-weight="600" font-size="10" text-anchor="middle">ประกัน 90 วัน</text>
    </g>
  </g>
</svg>
