<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgBatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cameraLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgBatGrad)" />

  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" /><line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" /><line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" /><line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Left: Graphic of Genuine Battery and 200MP Camera Module -->
  <g transform="translate(60, 50)">
    <!-- Battery Cell Body -->
    <rect x="30" y="30" width="160" height="280" rx="10" fill="url(#batteryGrad)" stroke="#64748b" stroke-width="1.5" />
    
    <!-- Battery Text / Specs -->
    <text x="110" y="65" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" text-anchor="middle">SAMSUNG</text>
    <text x="110" y="85" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">SECONDARY Li-ion BATTERY</text>
    <text x="110" y="105" fill="#38bdf8" font-family="'Plus Jakarta Sans', monospace" font-weight="700" font-size="11" text-anchor="middle">EB-BS928ABY (5000 mAh)</text>

    <!-- TISI / มอก. Badge -->
    <rect x="55" y="125" width="110" height="35" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="110" y="142" fill="#10b981" font-family="'Prompt', sans-serif" font-weight="700" font-size="10" text-anchor="middle">มาตรฐาน มอก. แท้</text>
    <text x="110" y="154" fill="#64748b" font-family="'Plus Jakarta Sans', monospace" font-size="8" text-anchor="middle">TIS 2217-2548</text>

    <text x="110" y="185" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Nominal Voltage: 3.88V</text>
    <text x="110" y="200" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Charge Voltage: 4.45V</text>

    <!-- QR Code & Barcode Mock -->
    <rect x="50" y="220" width="40" height="40" fill="#ffffff" />
    <rect x="55" y="225" width="12" height="12" fill="#000000" />
    <rect x="73" y="225" width="12" height="12" fill="#000000" />
    <rect x="55" y="243" width="12" height="12" fill="#000000" />
    <rect x="70" y="240" width="6" height="6" fill="#000000" />
    <rect x="80" y="248" width="5" height="5" fill="#000000" />

    <text x="145" y="238" fill="#10b981" font-family="'Prompt', sans-serif" font-weight="700" font-size="10" text-anchor="middle">100% HEALTH</text>
    <text x="145" y="255" fill="#64748b" font-family="'Plus Jakarta Sans', monospace" font-size="9" text-anchor="middle">0 CYCLES NEW</text>

    <!-- Battery Top Flex Cable -->
    <path d="M 110 30 L 110 10 Q 110 0 120 0 L 140 0" fill="none" stroke="#f59e0b" stroke-width="4" />
    <rect x="140" y="-6" width="18" height="12" rx="2" fill="#eab308" />

    <!-- Camera Module Component Overlapping -->
    <g transform="translate(180, 180)">
      <rect x="0" y="0" width="140" height="140" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
      <!-- Main Lens -->
      <circle cx="70" cy="70" r="50" fill="#020617" stroke="#475569" stroke-width="2" />
      <circle cx="70" cy="70" r="40" fill="url(#cameraLens)" />
      <circle cx="70" cy="70" r="24" fill="#020617" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="62" cy="62" r="8" fill="#ffffff" opacity="0.4" />
      
      <!-- OIS / 200MP Badge -->
      <rect x="15" y="115" width="110" height="20" rx="4" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1" />
      <text x="70" y="129" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" text-anchor="middle">200MP ISOCELL HP2 OIS</text>
    </g>
  </g>

  <!-- Right Side Product Info -->
  <g transform="translate(420, 85)">
    <rect x="0" y="0" width="200" height="30" rx="15" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="100" y="20" fill="#60a5fa" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle">BATTERY & CAMERA MODULE</text>

    <text x="0" y="68" fill="#ffffff" font-family="'Prompt', sans-serif" font-weight="800" font-size="22">แบตเตอรี่แท้ & กล้อง 200MP</text>
    <text x="0" y="94" fill="#94a3b8" font-family="'Prompt', sans-serif" font-size="14">แบตเตอรี่ศูนย์ใหม่ 0 Cycle และชุดโมดูลกล้องแท้ OIS</text>

    <rect x="0" y="115" width="340" height="145" rx="14" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(148, 163, 184, 0.2)" />
    <text x="18" y="145" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">PART NUMBERS</text>
    <text x="18" y="165" fill="#60a5fa" font-family="'Plus Jakarta Sans', monospace" font-weight="700" font-size="13">EB-BS928ABY (Batt) / GH96-15931A (Cam)</text>

    <line x1="18" y1="180" x2="322" y2="180" stroke="rgba(148, 163, 184, 0.15)" />

    <text x="18" y="200" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">SAFETY & QUALITY</text>
    <text x="18" y="220" fill="#f1f5f9" font-family="'Prompt', sans-serif" font-weight="600" font-size="12">มีมาตรฐาน มอก. พร้อมกาวติดตั้งแท้ ไม่บวม ไม่เสื่อม</text>
    <text x="18" y="242" fill="#10b981" font-family="'Prompt', sans-serif" font-weight="600" font-size="12">● รองรับชาร์จไว Super Fast Charging 2.0 (45W)</text>

    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="100" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
      <text x="50" y="18" fill="#10b981" font-family="'Prompt', sans-serif" font-weight="600" font-size="10" text-anchor="middle">แบตใหม่ 100%</text>

      <rect x="110" y="0" width="105" height="28" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1" />
      <text x="162" y="18" fill="#06b6d4" font-family="'Prompt', sans-serif" font-weight="600" font-size="10" text-anchor="middle">กล้องโฟกัสแท้ OIS</text>

      <rect x="225" y="0" width="105" height="28" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1" />
      <text x="277" y="18" fill="#fbbf24" font-family="'Prompt', sans-serif" font-weight="600" font-size="10" text-anchor="middle">รับประกัน 6 เดือน</text>
    </g>
  </g>
</svg>
