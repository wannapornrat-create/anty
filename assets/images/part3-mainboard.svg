<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgBoardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0d1525" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldTraces" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgBoardGrad)" />

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" /><line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" /><line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" /><line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Left: Samsung Galaxy Mainboard Graphic -->
  <g transform="translate(100, 60)">
    <!-- Main PCB Board outline -->
    <path d="M 40 30 L 220 30 L 220 180 L 190 200 L 190 350 L 40 350 L 40 220 L 60 200 L 40 180 Z" fill="url(#pcbGrad)" stroke="#10b981" stroke-width="2" />

    <!-- Copper / Gold PCB Traces -->
    <g stroke="url(#goldTraces)" stroke-width="1.5" fill="none" opacity="0.75">
      <path d="M 60 50 L 90 50 L 110 70 L 140 70" />
      <path d="M 70 80 L 95 80 L 115 100 L 135 100" />
      <path d="M 120 180 L 120 220 L 150 250 L 150 300" />
      <path d="M 80 230 L 80 270 L 110 300 L 110 330" />
      <circle cx="140" cy="70" r="2.5" fill="#fbbf24" />
      <circle cx="135" cy="100" r="2.5" fill="#fbbf24" />
      <circle cx="150" cy="300" r="2.5" fill="#fbbf24" />
      <circle cx="110" cy="330" r="2.5" fill="#fbbf24" />
    </g>

    <!-- Main SOC Processor Chip (Snapdragon / Exynos) -->
    <rect x="80" y="70" width="85" height="85" rx="6" fill="url(#chipGrad)" stroke="#64748b" stroke-width="1.5" />
    <text x="122" y="105" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" text-anchor="middle">SNAPDRAGON 8</text>
    <text x="122" y="120" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" text-anchor="middle">GEN 3 FOR GALAXY</text>
    <text x="122" y="138" fill="#10b981" font-family="'Plus Jakarta Sans', monospace" font-size="7" text-anchor="middle">SEC UFS 4.0 / LPDDR5X</text>

    <!-- RF Module & Shielding Cans -->
    <rect x="60" y="180" width="60" height="40" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1" />
    <text x="90" y="205" fill="#cbd5e1" font-family="'Plus Jakarta Sans', monospace" font-size="7" text-anchor="middle">5G MODEM</text>

    <!-- Power IC (PMIC) -->
    <rect x="135" y="180" width="45" height="40" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="157" y="204" fill="#cbd5e1" font-family="'Plus Jakarta Sans', monospace" font-size="7" text-anchor="middle">PMIC</text>

    <!-- SIM Card Tray & Connectors -->
    <rect x="60" y="240" width="115" height="70" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,2" />
    <text x="117" y="278" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" text-anchor="middle">DUAL SIM / eSIM READY</text>
    <text x="117" y="295" fill="#10b981" font-family="'Prompt', sans-serif" font-weight="600" font-size="9" text-anchor="middle">✔ ไม่ติด Knox / ไม่ติดล็อคเครือข่าย</text>

    <!-- Gold Edge Connectors -->
    <rect x="195" y="50" width="20" height="8" rx="1" fill="#eab308" />
    <rect x="195" y="70" width="20" height="8" rx="1" fill="#eab308" />
    <rect x="195" y="110" width="20" height="8" rx="1" fill="#eab308" />
    <rect x="195" y="140" width="20" height="8" rx="1" fill="#eab308" />
  </g>

  <!-- Right: Info Panel -->
  <g transform="translate(420, 85)">
    <rect x="0" y="0" width="180" height="30" rx="15" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5" />
    <text x="90" y="20" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle">CLEAN MOTHERBOARD</text>

    <text x="0" y="68" fill="#ffffff" font-family="'Prompt', sans-serif" font-weight="800" font-size="22">เมนบอร์ดแท้ Samsung Galaxy</text>
    <text x="0" y="94" fill="#94a3b8" font-family="'Prompt', sans-serif" font-size="14">บอร์ดแท้ศูนย์ 100% ปลดล็อคสมบูรณ์ พร้อมใช้งาน</text>

    <rect x="0" y="115" width="340" height="145" rx="14" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(148, 163, 184, 0.2)" />
    <text x="18" y="145" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">PART NUMBER</text>
    <text x="18" y="165" fill="#10b981" font-family="'Plus Jakarta Sans', monospace" font-weight="700" font-size="14">GH96-16321B / GH96-15940A</text>

    <line x1="18" y1="180" x2="322" y2="180" stroke="rgba(148, 163, 184, 0.15)" />

    <text x="18" y="200" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">TEST STATUS</text>
    <text x="18" y="220" fill="#f1f5f9" font-family="'Prompt', sans-serif" font-weight="600" font-size="12">ผ่านการเทส Wi-Fi, สัญญาณ 5G, กล้อง, ชาร์จเร็ว</text>
    <text x="18" y="242" fill="#10b981" font-family="'Prompt', sans-serif" font-weight="600" font-size="12">● Clean IMEI ไม่ติด Gmail / ไม่ติด Knox Lock</text>

    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="105" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
      <text x="52" y="18" fill="#10b981" font-family="'Prompt', sans-serif" font-weight="600" font-size="10" text-anchor="middle">เทสผ่าน 100%</text>

      <rect x="115" y="0" width="105" height="28" rx="6" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="1" />
      <text x="167" y="18" fill="#60a5fa" font-family="'Prompt', sans-serif" font-weight="600" font-size="10" text-anchor="middle">ทุกความจุ 256/512</text>

      <rect x="230" y="0" width="105" height="28" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1" />
      <text x="282" y="18" fill="#fbbf24" font-family="'Prompt', sans-serif" font-weight="600" font-size="10" text-anchor="middle">รับประกัน 60 วัน</text>
    </g>
  </g>
</svg>
